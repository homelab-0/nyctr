name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API and security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r services/api/requirements-dev.lock
      - run: python -m ruff check nyctr tests
        working-directory: services/api
      - run: python -m pytest services/api/tests --junitxml=test-results/api.xml
        env:
          PYTHONPATH: services/api
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-test-results
          path: test-results/api.xml
          retention-days: 7
  frontend:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  container:
    name: Docker and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NYCTR_PORT: '8090'
      NYCTR_SMOKE_URL: http://127.0.0.1:8090
      NYCTR_SMOKE_ORIGIN: http://localhost:8090
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the live Compose configuration
        run: docker compose -f compose.yaml -f deploy/compose/compose.production.yaml config --quiet
        env:
          POSTGRES_PASSWORD: compose-validation-only
          NYCTR_PUBLIC_URL: https://nyctr.example.test
          FORWARDED_ALLOW_IPS: 127.0.0.1
      - name: Build and start the packaged application
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Verify served assets, authenticated API and member workflow
        run: python3 scripts/smoke.py
      - name: Restart application and verify persistence
        run: |
          docker compose restart nyctr
          python3 scripts/smoke.py --verify-persistence
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
