name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API and security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r services/api/requirements-dev.lock
      - run: python -m ruff check --config services/api/pyproject.toml services/api/nyctr services/api/tests scripts/release_metadata.py tests/release tests/acceptance tests/deployment
      - run: python -m pytest services/api/tests tests/release tests/acceptance --junitxml=test-results/api.xml
        env:
          PYTHONPATH: services/api
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-test-results
          path: test-results/api.xml
          retention-days: 7
  frontend:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  container:
    name: Docker and PostgreSQL (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      NYCTR_PORT: '8090'
      NYCTR_SMOKE_URL: http://127.0.0.1:8090
      NYCTR_SMOKE_ORIGIN: http://localhost:8090
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the live Compose configuration
        run: |
          docker compose -f compose.yaml -f deploy/compose/compose.production.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose/compose.production.yaml -f deploy/compose/compose.image.yaml config --quiet
        env:
          POSTGRES_PASSWORD: compose-validation-only
          NYCTR_PUBLIC_URL: https://nyctr.example.test
          FORWARDED_ALLOW_IPS: 127.0.0.1
          NYCTR_IMAGE: nyctr:ci-validation
      - name: Build and start the packaged application
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Verify served assets, authenticated API and member workflow
        run: python3 scripts/smoke.py
      - name: Restart application and verify persistence
        run: |
          docker compose restart nyctr
          python3 scripts/smoke.py --verify-persistence
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  acceptance:
    name: Isolated HTTPS provider acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: nyctr-ci-acceptance
      COMPOSE_FILE: tests/acceptance/compose.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build isolated application and provider fixtures
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Verify connection diagnostics and explicit collection
        run: python3 tests/acceptance/check.py
      - name: Restart application and verify persisted fixture data
        run: |
          docker compose restart nyctr
          python3 tests/acceptance/check.py --verify-persistence
      - name: Isolated fixture diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop isolated containers
        if: always()
        run: docker compose down --volumes

  chart:
    name: Helm chart (${{ matrix.helm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r services/api/requirements-dev.lock
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ matrix.helm }}
      - run: python -m pytest tests/deployment -q

  kubernetes:
    name: Helm installation and PostgreSQL persistence
    needs: [backend, frontend, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.1
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.11
      - name: Install verified kind binary
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          printf '%s  %s\n' \
            aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d \
            "$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install chart in isolated Kubernetes and test persistence
        run: bash scripts/kubernetes-smoke.sh
