name: Release

# A release is made by merging a version change to main. Every push to main
# runs the plan job, which takes seconds: it reads the version the source
# declares and asks the remote whether that version has a tag. If it has, the
# run ends there. If not, the same commit is verified, published and released.
# Nobody creates a tag or a GitHub Release by hand.
on:
  push:
    branches: [main]
  # Retry a release whose run failed, without another commit.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A run waiting behind another plans again when its turn
# comes and finds the version already released.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether this commit is an unreleased version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare the source version with the released tags
        id: plan
        run: python3 scripts/release_metadata.py --plan --github-output "$GITHUB_OUTPUT"

  verify:
    name: Validate release source
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish verified version
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
      chart_registry: ${{ steps.metadata.outputs.chart_registry }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Asked again here, immediately before anything is pushed: a version that
      # gained a tag while CI ran is never published a second time.
      - name: Validate version, main ancestry and that the version is unreleased
        id: metadata
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release_metadata.py \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --revision "$RELEASE_REVISION" \
            --require-unreleased \
            --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.version_tag }}
            ${{ steps.metadata.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.1
      # After the image, so a chart version never exists without its image.
      # The chart and application versions are both set from the validated tag,
      # whatever Chart.yaml says, and the chart is pushed under its own
      # namespace so it can never collide with an image tag.
      - name: Package and publish the Helm chart
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.version }}
          CHART_REGISTRY: ${{ steps.metadata.outputs.chart_registry }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/nyctr --version "$CHART_VERSION" --app-version "$CHART_VERSION" \
            --destination "$RUNNER_TEMP/chart"
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/chart/nyctr-$CHART_VERSION.tgz" "$CHART_REGISTRY"
          helm registry logout ghcr.io
      - name: Record immutable deployment reference
        env:
          RELEASE_IMAGE: ${{ steps.metadata.outputs.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_VERSION: ${{ steps.metadata.outputs.version }}
          CHART_REGISTRY: ${{ steps.metadata.outputs.chart_registry }}
        run: |
          printf '## Published image\n\n`%s@%s`\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Published chart\n\n`%s/nyctr` version `%s`\n' "$CHART_REGISTRY" "$CHART_VERSION" >> "$GITHUB_STEP_SUMMARY"

  # Last, so a GitHub Release and its tag exist only once the image, its
  # attestation and the chart are all published. If anything above fails there
  # is no tag, and running the workflow again retries the same version. This is
  # the only job that can write to the repository, and it cannot write packages.
  release:
    name: Create the GitHub Release
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create the release and its tag at the published commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
          CHART_REGISTRY: ${{ needs.publish.outputs.chart_registry }}
          CHART_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          case "$RELEASE_DIGEST" in sha256:*) ;; *) echo "No image digest was published" >&2; exit 1 ;; esac
          body="$RUNNER_TEMP/release-body.md"
          cp -- "$RELEASE_NOTES" "$body"
          {
            printf '\n## Artifacts\n\n'
            printf -- '- Image: `%s@%s`\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST"
            printf -- '- Chart: `%s/nyctr` version `%s`\n' "$CHART_REGISTRY" "$CHART_VERSION"
            printf -- '- Source: `%s`\n' "$RELEASE_REVISION"
          } >> "$body"
          flags=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_REVISION" \
            --title "$RELEASE_TAG" --notes-file "$body" "${flags[@]}"
      # A tag that someone created meanwhile would have been reused as it was.
      # Fail loudly if the tag is not the commit that was just published.
      - name: Confirm the tag identifies the published commit
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/release_metadata.py \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$RELEASE_REVISION" \
            --verify-git-tag
