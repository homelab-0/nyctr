name: Bug report
description: Report a reproducible problem with Nyctr.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security issues, follow SECURITY.md. Use synthetic data; omit credentials and browsing history."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [Demo, Live, Development]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment and sanitized diagnostics
      description: Browser, deployment method, provider/API versions, and minimal logs.
