# Disposable loopback ingress for the isolated acceptance application.
# The upstream is fixed; request paths and headers cannot select a destination.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not create an access log containing routine request paths or headers.
    access_log off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://nyctr:8080;
            proxy_http_version 1.1;
            # Preserve the external origin, including its configurable loopback port.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            # A connector diagnostic may legitimately take up to 90 seconds.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
