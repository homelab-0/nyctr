{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nyctr.fullname" . }}
  labels:
    {{- include "nyctr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nyctr.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
