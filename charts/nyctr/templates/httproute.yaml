{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nyctr.fullname" . }}
  labels:
    {{- include "nyctr.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "nyctr.hostname" . | quote }}
    {{- with include "nyctr.portalHostname" . }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ .Values.httpRoute.requestTimeout | quote }}
      backendRefs:
        - name: {{ include "nyctr.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
