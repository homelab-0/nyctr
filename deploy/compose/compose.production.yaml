# Merge with compose.yaml and an explicitly configured .env.production.
services:
  nyctr:
    environment:
      NYCTR_MODE: live
      NYCTR_DATABASE_URL: postgresql+psycopg://nyctr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/nyctr
      NYCTR_PUBLIC_URL: ${NYCTR_PUBLIC_URL:?Set the public HTTPS origin}
      NYCTR_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set the actual trusted reverse-proxy peer IPs}
      NYCTR_BOOTSTRAP_ADMIN_EMAIL: ${NYCTR_BOOTSTRAP_ADMIN_EMAIL:-}
      NYCTR_BOOTSTRAP_ADMIN_PASSWORD: ${NYCTR_BOOTSTRAP_ADMIN_PASSWORD:-}
      NYCTR_LOCAL_LOGIN_ENABLED: ${NYCTR_LOCAL_LOGIN_ENABLED:-true}
      NYCTR_OIDC_ISSUER: ${NYCTR_OIDC_ISSUER:-}
      NYCTR_OIDC_CLIENT_ID: ${NYCTR_OIDC_CLIENT_ID:-}
      NYCTR_OIDC_CLIENT_SECRET: ${NYCTR_OIDC_CLIENT_SECRET:-}
      NYCTR_OIDC_ADMIN_GROUPS: ${NYCTR_OIDC_ADMIN_GROUPS:-}
      NYCTR_OIDC_ALLOWED_GROUPS: ${NYCTR_OIDC_ALLOWED_GROUPS:-}
      NYCTR_OIDC_GROUPS_CLAIM: ${NYCTR_OIDC_GROUPS_CLAIM:-groups}
      NYCTR_CONNECTOR_HOSTS: ${NYCTR_CONNECTOR_HOSTS:-}
      NYCTR_CONNECTOR_SECRET_UNIFI: ${NYCTR_CONNECTOR_SECRET_UNIFI:-}
      NYCTR_CONNECTOR_SECRET_NEXTDNS: ${NYCTR_CONNECTOR_SECRET_NEXTDNS:-}
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - live-data:/var/lib/postgresql/data
volumes:
  live-data:
