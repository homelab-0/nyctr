# Merge with compose.yaml and an explicitly configured .env.production.
# Refuses to start without a list of proxies, under the new name or for this release the old one.
x-proxies-required: ${NYCTR_TRUSTED_PROXIES:-${FORWARDED_ALLOW_IPS:?Set NYCTR_TRUSTED_PROXIES to the actual trusted reverse-proxy peer IPs}}
services:
  nyctr:
    environment:
      NYCTR_MODE: live
      NYCTR_DATABASE_URL: postgresql+psycopg://nyctr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/nyctr
      NYCTR_PUBLIC_URL: ${NYCTR_PUBLIC_URL:?Set the public HTTPS origin}
      NYCTR_PORTAL_URL: ${NYCTR_PORTAL_URL:-}
      NYCTR_COOKIE_SECURE: "true"
      NYCTR_TRUSTED_PROXIES: ${NYCTR_TRUSTED_PROXIES:-}
      # The old name of the list above, read for this release when that one is empty. Nyctr warns while it is used.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      NYCTR_PROXY_HOPS: ${NYCTR_PROXY_HOPS:-1}
      NYCTR_BOOTSTRAP_ADMIN_EMAIL: ${NYCTR_BOOTSTRAP_ADMIN_EMAIL:-}
      NYCTR_BOOTSTRAP_ADMIN_PASSWORD: ${NYCTR_BOOTSTRAP_ADMIN_PASSWORD:-}
      NYCTR_LOCAL_LOGIN_ENABLED: ${NYCTR_LOCAL_LOGIN_ENABLED:-true}
      NYCTR_OIDC_ISSUER: ${NYCTR_OIDC_ISSUER:-}
      NYCTR_OIDC_CLIENT_ID: ${NYCTR_OIDC_CLIENT_ID:-}
      NYCTR_OIDC_CLIENT_SECRET: ${NYCTR_OIDC_CLIENT_SECRET:-}
      NYCTR_OIDC_ADMIN_GROUPS: ${NYCTR_OIDC_ADMIN_GROUPS:-}
      NYCTR_OIDC_ALLOWED_GROUPS: ${NYCTR_OIDC_ALLOWED_GROUPS:-}
      NYCTR_OIDC_GROUPS_CLAIM: ${NYCTR_OIDC_GROUPS_CLAIM:-groups}
      NYCTR_CONNECTOR_HOSTS: ${NYCTR_CONNECTOR_HOSTS:-}
      NYCTR_CONNECTOR_SECRET_UNIFI: ${NYCTR_CONNECTOR_SECRET_UNIFI:-}
      NYCTR_CONNECTOR_SECRET_NEXTDNS: ${NYCTR_CONNECTOR_SECRET_NEXTDNS:-}
      NYCTR_CONNECTOR_SECRET_PROXMOX: ${NYCTR_CONNECTOR_SECRET_PROXMOX:-}
      NYCTR_CONNECTOR_SECRET_PIHOLE: ${NYCTR_CONNECTOR_SECRET_PIHOLE:-}
      NYCTR_PROVIDER_WRITES: ${NYCTR_PROVIDER_WRITES:-}
      NYCTR_COLLECT_INTERVAL_SECONDS: ${NYCTR_COLLECT_INTERVAL_SECONDS:-0}
      NYCTR_NUDGE_TOKEN: ${NYCTR_NUDGE_TOKEN:-}
      NYCTR_AI_BASE_URL: ${NYCTR_AI_BASE_URL:-}
      NYCTR_AI_MODEL: ${NYCTR_AI_MODEL:-}
      NYCTR_AI_API_KEY: ${NYCTR_AI_API_KEY:-}
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - live-data:/var/lib/postgresql/data
volumes:
  live-data:
